<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Derryth Nash Creative</title>
  <link href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap" rel="stylesheet">
  <style>
  :root {
  --primary: #b30051;
  --accent: #a8c41d;
  --light: #d6adb9;
  --neutral: #dedcd0;
  --text: #222;
  --card: #fff;
}
a {
  text-decoration: none;
}

body {
  margin: 0;
  font-family: Verdana, sans-serif;
  background: var(--card);
  color: var(--text);
}

header {
  text-align: center;
  padding: 0;
}
.headings {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr; /* three equal columns */
  text-align: center;
  padding: .0em;
  gap: .5em;
}

.headings h1 {
font-family: Sacramento, cursive;
color: var(--primary);
font-size: 4.5em;
  margin: 0;
}

.logo {
  max-width: 450px;
  margin: 0.2em auto 0 auto; /* top | left/right | bottom */
  display: block;
}


h1 {
  font-size: 4.5em;
  font-family: Sacramento, cursive;
  color: var(--primary);
  margin-bottom: 0em;
}

/* Three-column layout for services */
.services {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr; /* three equal columns */
  gap: 1.5em;
  padding: .2em;
}

/* Mobile adjustments */
@media (max-width: 600px) {
  .headings h1 {
    font-size: 1.5em;
  }


  .services {
    grid-template-columns: 1fr; /* stack into one column on phones */
  }
}

.service {
  background: var(--neutral);
  border-top: 12px solid var(--accent);
  border-radius: 8px;
  padding: 1em;
  box-shadow: 0;
  text-align: center;
}

.service h2 {
  font-size: 1.2em;
  color: var(--primary);
  margin: 0 0 0.4em 0;
}

.service h3 {
  font-size: .9em;
  color: var(--text);
  margin-bottom: 0.1em;
  font-style: italic;
}

.service .desc {
  font-size: .75em;
  color: var(--text);
  margin-bottom: 0.8em;
}

.service-img {
  max-width: 100%;
  max-height: 135px;
  border-radius: 6px;
  margin-top: 0.5em;
  object-fit: cover;
  transition: transform 0.3s ease;  /* smooth animation */
  cursor: pointer;
}

.service-img:hover {
  transform: scale(3.5);
  box-shadow: 0 8px 20px rgba(0,0,0,0.3);

  
}

footer {
  text-align: center;
  background: var(--card);
  padding: 2em 0 1em 0;
  margin-top: 2em;
  border-top: 4px solid var(--primary);
  font-size: .8em;
  color: var(--primary);
}
.contact-btn {
  display: inline-block;
  margin-top: 1em;
  padding: 10px 20px;
  background-color: var(--accent);
  color: var(--text);
  text-decoration: none;
  border-radius: 5px;
  font-weight: bold;
  transition: background-color 0.3s ease;
}

.contact-btn:hover {
  background-color: var(--light);
  color: var(--text);
}

/* Responsive: stack services on small screens */
@media (max-width: 700px) {
  .services {
    grid-template-columns: 1fr; /* single column on mobile */
  }

  /* Make paragraph text smaller on phones */
@media (max-width: 700px) {
  .desc p {
    font-size: 0.8em;
    line-height: 1.4;
  }
}

}

  </style>
</head>
<body>
  <header>
    <a href="https://yourvintagematters.github.io/Derryth_Nash_Creative/" style="text-decoration: none;"> <img src="logo_white_bground.jpg" alt="Derryth Nash Creative Logo" class="logo"> </a>
    
    <div class="desc" style="grid-column: 1 / -1;">

<p>text.</p>

 </div>
    <section class="headings">
<h1>&nbsp;</h1>      <h1>Artwork</h1>  <h1>&nbsp;</h1>  
      
    
  </section>
</header>


 

    <footer>
      <strong>Derryth Nash</strong><br>
      <a href="mailto:derrythnash@gmail.com" style="color:var(--primary);text-decoration:underline;">derrythnash@gmail.com</a>
    </footer>
 
</body>
</html>
