  <title>Derryth Nash Creative</title>

  :root {
    --primary: #b30051;
    --accent: #a8c41d;
    --light: #d6adb9;
    --neutral: #f4f2e7;
    --text: #222;
    --card: #fff;
  }

  body {
    margin: 0;
    font-family: Verdana, sans-serif;
    background: var(--card);
    color: var(--text);
  }

  header {
    text-align: center;
    padding: 0;
  }

  .header-line {
    width: 100%;
    height: 4px;
    background: var(--accent);
    margin: 1em 0;
  }

  .logo {
    max-width: 450px;
    margin: 0.2em auto 0 auto;
    display: block;
  }

  .headings {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    text-align: center;
    gap: .5em;
  }

  .headings h1 {
    font-family: "Love Light", cursive;
    color: var(--primary);
    font-size: 4.5em;
    margin: 0;
  }

  /* Services grid */
  .services {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 1.5em;
    padding: .2em;
  }
