  <style>
  :root {
    --primary: #b30051;
    --accent: #a8c41d;
    --light: #d6adb9;
    --neutral: #f4f2e7;
    --text: #222;
    --card: #fff;
  }

  body {
    margin: 0;
    font-family: Verdana, sans-serif;
    background: var(--card);
    color: var(--text);
  }

  /* --- LAYOUT WITH SIDEBAR --- */
  .layout {
    display: grid;
    grid-template-columns: 220px 1fr;
    min-height: 100vh;
  }

  .sidebar {
    background: var(--neutral);
    border-right: 4px solid var(--primary);
    padding: 2em 1em;
    display: flex;
    flex-direction: column;
    gap: 1em;
  }

    font-family: Inter, sans-serif;
    font-weight: 500;
    color: var(--primary);
    text-decoration: none;
    padding: .5em 0;
    transition: color .3s ease;
  }
