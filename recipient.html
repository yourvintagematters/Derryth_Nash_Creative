<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Whispers — Your Daily Quote</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #E6F2F8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 36px 28px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 6px 24px rgba(0,0,0,0.10);
    }
    .emoji { font-size: 48px; margin-bottom: 16px; }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      color: #555;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-block;
      background-color: #5d8aa8;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 12px;
      margin-bottom: 16px;
      width: 100%;
    }
    .sub {
      font-size: 13px;
      color: #999;
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">💌</div>
    <h1>Daily Whispers</h1>
    <p>
      Someone special sent you a year of daily quotes — one heartfelt message
      delivered to you every morning.<br /><br />
      To read your quote, download the Daily Whispers app.
    </p>
    <a class="btn" href="https://apps.apple.com/app/id6755615451">
      Download on the App Store
    </a>
    <p class="sub">Already have the app? Open it to see today's quote.</p>
  </div>
</body>
</html>
